<h1>Joyeuse VM Lane</h1>
<p>Joyeuse VM Lane is a personal tool used by one person, its owner, to let his own virtual machine work with his own Google account - Drive, Gmail, and Calendar - at his direction.</p>
<p>It is not a public service. It has no other users, no sign-up, and nothing to sell.</p>
<p>Fiat lux.</p>
